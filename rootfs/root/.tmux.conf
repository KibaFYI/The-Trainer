# axolotl-forge tmux — the training job runs in session "forge" (attach: forge attach)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g default-shell /bin/zsh
set -g history-limit 100000
set -g mouse on
set -g escape-time 10

# default text colour inside every pane is purple
set -g window-style "fg=#B388FF"
set -g window-active-style "fg=#B388FF"

set -g status-style "bg=#24173A,fg=#B388FF"
set -g status-left "#[bold,fg=#1A1028,bg=#B388FF] 🦎 forge #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#9575CD]%H:%M #[fg=#7C4DFF]│ #[fg=#D1B3FF]#H "
set -g window-status-current-style "fg=#EA80FC,bold"
set -g window-status-style "fg=#9575CD"
set -g pane-border-style "fg=#4A148C"
set -g pane-active-border-style "fg=#EA80FC"
set -g message-style "bg=#7C4DFF,fg=#FFFFFF"
set -g mode-style "bg=#7C4DFF,fg=#FFFFFF"
